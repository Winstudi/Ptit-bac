  <script>
  (() => {
    "use strict";

    const esc = value =>
      String(value ?? "").replace(
        /[&<>"']/g,
        char => ({
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"
        })[char]
      );

    function stateNow(){
      try{
        return session?.state || null;
      }catch{
        return null;
      }
    }

    function avatarFor(player){
      const raw = player?.avatar || "";
      const seed =
        player?.id ||
        player?.name ||
        "category-chooser";

      if(window.PtitBacAvatarPagesFix?.normalizeAvatar){
        return window.PtitBacAvatarPagesFix.normalizeAvatar(raw, seed);
      }

      if(window.PtitBacAvatars?.normalize){
        return window.PtitBacAvatars.normalize(raw);
      }

      return "/a1.webp";
    }

    function patchCategoryChooser(){
      const screen =
        document.querySelector(".category-pick-screen.cat-v2");

      if(!screen) return;

      const state = stateNow();

      if(!state || state.phase !== "category_selection") return;

      const copy =
        screen.querySelector(".category-pick-copy.cat-v2-copy");

      if(!copy) return;

      copy.querySelector("h1")?.remove();
      copy.querySelector(".cat-chooser")?.remove();

      const chooser =
        (state.players || []).find(
          p =>
            String(p.id) ===
            String(state.categoryChooserPlayerId)
        ) || null;

      const existing =
        screen.querySelector(".cat-existing-chooser");

      const chooserId =
        String(chooser?.id || "");

      if(
        existing &&
        existing.dataset.chooserId === chooserId
      ){
        return;
      }

      existing?.remove();

      const card =
        document.createElement("section");

      card.className = "cat-existing-chooser";
      card.dataset.chooserId = chooserId;

      const name =
        chooser?.name || "Un joueur";

      card.innerHTML = `
        <div class="cat-existing-chooser-avatar">
          <img
            src="${esc(avatarFor(chooser))}"
            alt=""
            draggable="false"
          >
        </div>

        <div class="cat-existing-chooser-copy">
          <small>C’est à</small>
          <strong>${esc(name)}</strong>
          <span>de choisir les catégories</span>
        </div>
      `;

      copy.insertAdjacentElement(
        "afterend",
        card
      );
    }

    function schedule(){
      requestAnimationFrame(patchCategoryChooser);
    }

    document.addEventListener(
      "DOMContentLoaded",
      () => {
        schedule();

        const app = document.getElementById("app");

        if(app){
          new MutationObserver(schedule).observe(
            app,
            {
              childList:true,
              subtree:true
            }
          );
        }

        try{
          socket?.on?.("room:state", schedule);
        }catch{}
      },
      {once:true}
    );
  })();
  </script>
